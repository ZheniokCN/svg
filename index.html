<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <svg width="200" height="200" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="moon">
        <stop offset="0" stop-color="#f5f5f5"></stop>
        <stop offset="100%" stop-color="#9f9f9f"></stop>
      </linearGradient>
      <linearGradient x1="100%" y1="0"  x2="0" y2="0" id="sky" spreadMethod="pad">
        <stop offset="0" stop-color="#000"></stop>
        <stop offset="100%" stop-color="lightskyblue"></stop>
      </linearGradient>
    </defs>
    <rect class="sky" x="3" y="3" fill="url(#sky)" width="94" height="94"></rect>
    <path d="M0,0 100,0 100,100 0,100 0,0" stroke="#ccc" stroke-width="3" stroke-dasharray="3"
      fill="none"></path>
      <g>
        <circle class="animated-snow snow-group-2" r="1" fill="#FFF" cx="90" cy="2"></circle>
        <circle class="animated-snow snow-group-1" r="1" fill="#FFF" cx="80" cy="2"></circle>
        <circle class="animated-snow snow-group-2" r="1" fill="#FFF" cx="70" cy="2"></circle>
        <circle class="animated-snow snow-group-1" r="1" fill="#FFF" cx="60" cy="2"></circle>
        <circle class="animated-snow snow-group-2" r="1" fill="#FFF" cx="50" cy="2"></circle>
        <circle class="animated-snow snow-group-1" r="1" fill="#FFF" cx="40" cy="2"></circle>
        <circle class="animated-snow snow-group-2" r="1" fill="#FFF" cx="30" cy="2"></circle>
        <circle class="animated-snow snow-group-1" r="1" fill="#FFF" cx="20" cy="2"></circle>
        <circle class="animated-snow snow-group-2" r="1" fill="#FFF" cx="10" cy="2"></circle>
      </g>
    <g>
      <path id="motionPath" d="M-20,34 Q50,-25 120,34" fill="none"></path>
      <circle class="amimation-sun" fill="#fcad3a" id="sun" r="10" cx="-20" cy="24">
      </circle>
      <circle class="amimation-moon" fill="url(#moon)" r="10" cx="-20" cy="24">
      </circle>
    </g>
    <rect class="theGrass" width="94" height="14" fill="#7fdc48" x="3" y="83.5"></rect>
    <g>
      <line class="tree-1" stroke-linecap="round" x1="44" x2="44" y1="66" y2="30" stroke="#46a655" stroke-width="19"></line>
      <polyline points="43,84 43,67 39,64 43,67 43,55" stroke="#6c4127" fill="none" stroke-width="3"></polyline>
    </g>
    <g>
      <line class="tree-2" stroke-linecap="round" x1="58" x2="58" y1="66" y2="20" stroke="#b7f07d" stroke-width="19"></line>
      <polyline points="73,84 73,72" stroke="#6c4127" fill="none" stroke-width="3"></polyline>
    </g>
    <g>
      <line class="tree-3" stroke-linecap="round" x1="73" x2="73" y1="65" y2="45" stroke="#7fdc48" stroke-width="19"></line>
      <polyline points="57,84 57,67 53,64 57,67 61,64 57,67 57,58 53,54 57,58 57,46" stroke="#6c4127" fill="none"
        stroke-width="3"></polyline>    
    </g>
  </svg>
</body>

</html>
